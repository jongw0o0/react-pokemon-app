spring:
  application:
    name: arch
  
  # security:
  #   user:
  #   name: test
  #   password: '1234'

  # 1. 데이터베이스 접속 설정 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pokepokeArch?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
    username: pokepokeArch
    password: '1234' 

  jpa:
    hibernate:
      # update: 엔티티 수정 시 테이블 구조를 자동으로 반영
      # create: 서버 켤 때마다 테이블을 다 밀고 새로 생성
      ddl-auto: update
    show-sql: true           # 콘솔에 실행 SQL 출력
    properties:
      hibernate:
        format_sql: true     # SQL을 가독성 좋게 정렬
        dialect: org.hibernate.dialect.MySQLDialect		#방언 설정

logging:
  level:
    org.hibernate.SQL: debug              # 실행 SQL 로그 레벨
    org.hibernate.orm.jdbc.bind: trace    # SQL에 담긴 실제 파라미터(값) 확인

server:
  port: 8000